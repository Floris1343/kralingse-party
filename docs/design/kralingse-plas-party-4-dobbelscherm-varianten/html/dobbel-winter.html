@keyframes kp-spin{from{transform:rotateX(-20deg) rotateY(0deg)}to{transform:rotateX(-20deg) rotateY(-360deg)}}

@keyframes kp-wiebel{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes kp-hint{0%,100%{opacity:.55}50%{opacity:1}}
.kp-zweef{animation:kp-zweef 2s ease-in-out infinite}
.kp-spin{animation:kp-spin 1.1s linear infinite}
.kp-spin-snel{animation:kp-spin .7s linear infinite}
.kp-spin-slak{animation:kp-spin 2.2s linear infinite}
.kp-kantel{animation:kp-kantel 2.6s ease-in-out infinite}
.kp-cijfers{animation:kp-cijfers .6s steps(10) infinite}
.kp-cijfers-snel{animation:kp-cijfers .36s steps(10) infinite}
.kp-cijfers3{animation:kp-cijfers3 .5s steps(3) infinite}
.kp-wiebel{animation:kp-wiebel .8s ease-in-out infinite;transform-origin:50% 100%}
.kp-hint{animation:kp-hint 1.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.kp-zweef,.kp-spin,.kp-spin-snel,.kp-spin-slak,.kp-kantel,.kp-cijfers,.kp-cijfers-snel,.kp-cijfers3,.kp-wiebel,.kp-hint{animation:none}}
